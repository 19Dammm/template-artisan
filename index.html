<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Démo : ne pas indexer. À retirer à la mise en ligne d'un vrai client (avec public/_headers), et remettre <link rel="canonical" href="https://…/page.html" /> -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," /><!-- à remplacer par le logo : <link rel="icon" href="favicon.png" /> -->
    <!-- Titre et description = ce qui s'affiche dans Google : à personnaliser pour chaque client -->
    <title>[Métier] à [Ville] — [Nom de l'entreprise]</title>
    <meta
      name="description"
      content="[Nom de l'entreprise], plombier-chauffagiste [à Ville] et alentours : fuite, débouchage, panne de chaudière. Prix annoncé avant d'intervenir, devis gratuit."
    />
    <!-- Partage sur les réseaux (Open Graph) : à remplir à la mise en ligne -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="[Métier] à [Ville] — [Nom de l'entreprise]" />
    <meta property="og:description" content="[Nom de l'entreprise], plombier-chauffagiste [à Ville] et alentours : fuite, débouchage, panne de chaudière. Prix annoncé avant d'intervenir, devis gratuit." />
    <meta property="og:image" content="[URL d'une vraie photo]" />
    <meta property="og:url" content="[URL de la page]" />
    <!-- À remplir avec les vraies données avant la mise en ligne. Ne pas publier avec des crochets.
         Balisage "entreprise locale" pour Google : rempli au build depuis src/site.js (voir vite.config.js) -->
    <!-- donnees-structurees -->
  </head>
  <body data-page="accueil">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
